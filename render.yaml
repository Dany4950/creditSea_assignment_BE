services:
  - type: web
    name: creditsea-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_KEY
        sync: false
      - key: DEMO_MODE
        value: "true"
      - key: STEP_DELAY_SECONDS
        value: "8"
